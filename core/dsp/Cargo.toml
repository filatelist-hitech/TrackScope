[package]
name = "hitech-bpm-dsp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Realtime DSP contract and tempo candidate normalization for hitech-bpm-radar"

[lib]
name = "hitech_bpm_dsp"
path = "src/lib.rs"

[[bin]]
name = "analyze_wav"
path = "src/bin/analyze_wav.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"

[[test]]
name = "key_detection"
path = "tests/key_detection.rs"

[dev-dependencies]
serde_json = "1"
