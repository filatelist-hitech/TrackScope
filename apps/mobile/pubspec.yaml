name: TrackScope
description: Realtime hitech/psytrance BPM radar mobile shell.
publish_to: "none"
version: 1.1.1+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  record: ^6.0.0
  permission_handler: ^12.0.0
  # Pure-Dart FFT for the Dart-side spectrogram visualisation. No platform
  # channels — safe to call from any isolate. Added Phase 5 UI.
  fftea: ^1.5.0
  # JetBrains Mono for BPM numerals and numeric metrics (Phase 7 design system).
  # Pure-Dart, no platform channel — safe in any isolate. google_fonts 6.x
  # is compatible with Flutter 3.44 / Dart 3.12.
  google_fonts: ^6.2.1
  # RevenueCat IAP SDK — only imported by revenuecat_gateway.dart;
  # web/test builds are unaffected because no other file touches it.
  purchases_flutter: ^8.0.0
  # Share files (CSV/JSON export) via platform share sheet.
  share_plus: ^10.0.0
  # Temp directory for export files before sharing.
  path_provider: ^2.1.0
  # Persist settings and BpmSession history across launches.
  shared_preferences: ^2.3.0
  # Keep screen on while capturing (Settings toggle).
  wakelock_plus: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  ffigen: ^13.0.0

flutter:
  uses-material-design: true

# ffigen config — regenerate Dart bindings from the C ABI header.
#
# Run from `apps/mobile/`:
#   flutter pub run ffigen --config pubspec.yaml
#
# The generated output (`lib/dsp/bindings.dart`) is checked in so
# contributors don't need libclang locally just to build. Re-run when the
# C header changes.
ffigen:
  name: HitechBpmFfi
  description: |
    Low-level Dart bindings for the hitech-bpm-ffi C ABI. Do not edit by
    hand — regenerate via `flutter pub run ffigen`.
  output: "lib/dsp/bindings.dart"
  headers:
    entry-points:
      - "../../core/ffi/include/hitech_bpm_ffi.h"
  preamble: |
    // GENERATED by package:ffigen. Do not edit by hand.
    // ignore_for_file: type=lint, unused_field, camel_case_types
  functions:
    include:
      - "hitech_bpm_engine_.*"
      - "hitech_bpm_string_free"
  structs:
    include:
      - "HitechBpmEngine"
