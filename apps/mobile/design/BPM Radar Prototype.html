<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BPM Radar — Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#07090a;font-family:'IBM Plex Mono',monospace;height:100%;overflow:hidden;}
  /* Stage */
  #stage{display:flex;width:100%;height:100vh;align-items:center;justify-content:center;background:#07090a;}
  .label{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;color:#1a3028;text-transform:uppercase;white-space:nowrap;}
  .hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.06em;color:#1a3028;white-space:nowrap;text-align:center;line-height:1.7;}
  /* Phone */
  .phone{width:375px;height:812px;max-height:100vh;background:#050807;border-radius:50px;border:1.5px solid #1a2d24;box-shadow:0 0 0 6px #030504,0 40px 100px rgba(0,0,0,.9);overflow:hidden;position:relative;display:flex;flex-direction:column;}
  @media(max-width:420px){
    #stage{align-items:flex-start;}
    .phone{width:100vw;height:100vh;border-radius:0;border:none;box-shadow:none;}
    .label,.hint{display:none;}
  }
  /* Screen system */
  .screens{flex:1;position:relative;overflow:hidden;min-height:0;}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#050807;transition:transform .3s cubic-bezier(.4,0,.2,1);overflow:hidden;}
  .screen.hidden-right{transform:translateX(100%);}
  .screen.hidden-left{transform:translateX(-100%);}
  .screen.active{transform:translateX(0);}
  /* Status bar */
  .sb{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 4px;font-size:10px;color:#7ab8aa;flex-shrink:0;}
  .sb-r{display:flex;align-items:center;gap:5px;}
  .batt{background:#1a2d24;border-radius:3px;padding:2px 6px;font-size:9px;}
  /* Nav */
  .nav{display:flex;align-items:center;padding:4px 20px 12px;gap:10px;flex-shrink:0;}
  .nav-title{font-size:9px;letter-spacing:.2em;color:#253c32;flex:1;text-align:center;}
  .nav-btn{width:30px;height:30px;background:#0d1712;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;flex-shrink:0;}
  .nav-btn:active{background:#1a2d24;}
  .pro{background:#00dfb0;color:#000;font-size:9px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer;border:none;font-family:'IBM Plex Mono',monospace;}
  .pro:active{opacity:.7;}
  .rec{background:#d03030;color:#fff;font-size:8px;font-weight:600;padding:3px 9px;border-radius:14px;display:flex;align-items:center;gap:4px;}
  .rdot{width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.2s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  /* Zone label */
  .zlbl{font-size:7.5px;letter-spacing:.18em;color:#1a3028;padding:6px 22px 3px;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;}
  .listening{display:flex;align-items:center;gap:4px;font-size:7px;color:#00dfb0;}
  .ldot{width:5px;height:5px;border-radius:50%;background:#00dfb0;animation:blink 1.5s ease-in-out infinite;}
  /* Freq axis */
  .faxis{display:flex;justify-content:space-between;padding:3px 22px 5px;font-size:7px;color:#1a3028;border-top:1px solid rgba(0,223,176,.18);background:#040705;flex-shrink:0;}
  /* Card */
  .card{background:#0c1410;border-radius:22px 22px 0 0;padding:20px 22px 16px;flex:1;display:flex;flex-direction:column;overflow:hidden;}
  /* BPM hero */
  .bpm-n{font-size:72px;font-weight:600;line-height:1;letter-spacing:-.04em;text-align:center;}
  .bpm-n.green{color:#00dfb0;}
  .bpm-n.amber{color:#ffe090;}
  .bpm-n.dim{color:#1e3530;font-size:58px;}
  .bpm-meta{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:5px;}
  .bpm-unit{font-size:12px;color:#3a6858;letter-spacing:.2em;}
  .bpm-range{font-size:8px;color:#1a3028;}
  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:3px 10px;font-size:8px;font-weight:500;}
  .pill-amber{background:rgba(200,138,24,.18);color:#ffe090;border:1px solid rgba(200,138,24,.3);}
  .pill-teal{background:rgba(0,223,176,.1);color:#00dfb0;border:1px solid rgba(0,223,176,.3);}
  .pdot{width:4px;height:4px;border-radius:50%;background:currentColor;}
  /* Confidence */
  .conf{display:flex;align-items:center;gap:9px;margin:12px 0 10px;}
  .ctrack{flex:1;height:7px;background:#111916;border-radius:4px;overflow:hidden;}
  .cfill{height:100%;border-radius:4px;transition:width .4s;}
  .cval{font-size:10px;flex-shrink:0;font-weight:500;}
  /* Break btn */
  .brk{background:#0c1410;border:1px solid #1e3530;border-radius:9px;padding:8px 18px;font-size:8.5px;color:#3a6858;display:flex;align-items:center;gap:6px;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:border-color .15s,color .15s;align-self:center;}
  .brk:active{border-color:#00dfb0;color:#00dfb0;}
  /* Stats */
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin-top:14px;}
  .sc{display:flex;flex-direction:column;gap:2px;}
  .sl{font-size:6.5px;letter-spacing:.12em;color:#1a3028;text-transform:uppercase;}
  .sv{font-size:11px;color:#5a8878;}
  .sv.g{color:#00dfb0;}
  .sv.link{color:#00dfb0;cursor:pointer;display:flex;align-items:center;gap:3px;}
  .sv.link:active{opacity:.6;}
  /* Mode switcher */
  .modes{display:flex;gap:6px;justify-content:center;margin-top:auto;padding-top:14px;}
  .mode-opt{border:1px solid #1a2d24;border-radius:7px;padding:4px 10px;font-size:7.5px;color:#1a3028;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:all .15s;letter-spacing:.06em;text-transform:uppercase;}
  .mode-opt.on{border-color:#00dfb0;color:#00dfb0;background:rgba(0,223,176,.06);}
  /* Signal Analyzer */
  .sa-grp{margin:0 16px 8px;background:#0d1712;border-radius:13px;overflow:hidden;flex-shrink:0;}
  .sa-hdr{font-size:7px;letter-spacing:.14em;color:#1a3028;text-transform:uppercase;padding:8px 16px 4px;flex-shrink:0;}
  .sa-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #080c09;gap:10px;}
  .sa-row:last-child{border-bottom:none;}
  .sa-lbl{flex:1;font-size:9px;color:#3a6858;}
  .sa-val{font-size:9px;color:#c8dcd8;}
  .sa-bw{width:80px;height:5px;background:#111916;border-radius:3px;overflow:hidden;}
  .sa-bf{height:100%;border-radius:3px;}
  .cand-row{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #080c09;gap:10px;}
  .cand-row:last-child{border-bottom:none;}
  .cand-bpm{font-size:17px;font-weight:600;width:60px;flex-shrink:0;}
  .cand-bpm.top{color:#00dfb0;}
  .cand-bpm.dim{color:#3a6858;}
  .cbw{flex:1;height:4px;background:#111916;border-radius:2px;overflow:hidden;}
  .cbf{height:100%;border-radius:2px;}
  .cpct{font-size:9px;color:#3a6858;width:32px;text-align:right;flex-shrink:0;}
  /* History */
  .hist-top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px 8px;flex-shrink:0;}
  .hstats{display:flex;gap:22px;}
  .hst{display:flex;flex-direction:column;gap:1px;}
  .hst-v{font-size:18px;font-weight:600;color:#00dfb0;line-height:1;}
  .hst-l{font-size:6.5px;letter-spacing:.12em;color:#1a3028;text-transform:uppercase;}
  .exp-btn{background:#0d1712;border:1px solid #1e3530;border-radius:8px;padding:6px 11px;font-size:8px;color:#3a6858;font-family:'IBM Plex Mono',monospace;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .datelbl{font-size:7px;letter-spacing:.14em;color:#1a3028;text-transform:uppercase;padding:5px 20px 3px;flex-shrink:0;}
  .hist-grp{margin:0 14px 4px;background:#0d1712;border-radius:13px;overflow:hidden;flex-shrink:0;}
  .hist-item{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid #080c09;gap:12px;cursor:pointer;}
  .hist-item:last-child{border-bottom:none;}
  .hist-item:active{background:rgba(0,223,176,.04);}
  .hbpm{font-size:20px;font-weight:600;width:58px;flex-shrink:0;}
  .hbpm.g{color:#00dfb0;}
  .hbpm.a{color:#ffe090;}
  .hmeta{flex:1;display:flex;flex-direction:column;gap:4px;}
  .htime{font-size:8.5px;color:#3a6858;}
  .hcbar{height:3px;background:#111916;border-radius:2px;overflow:hidden;}
  .hcfill{height:100%;border-radius:2px;}
  /* Settings */
  .sscroll{flex:1;overflow-y:auto;overflow-x:hidden;}
  .sscroll::-webkit-scrollbar{display:none;}
  .s-hdr{font-size:7px;letter-spacing:.14em;color:#1a3028;text-transform:uppercase;padding:10px 20px 4px;}
  .s-grp{margin:0 14px 4px;background:#0d1712;border-radius:13px;overflow:hidden;}
  .s-row{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid #080c09;gap:10px;cursor:pointer;}
  .s-row:last-child{border-bottom:none;}
  .s-row:active{background:rgba(255,255,255,.02);}
  .s-lbl{flex:1;font-size:9px;color:#3a6858;}
  .s-val{font-size:8.5px;color:#1a3028;}
  .s-chev{color:#1a3028;font-size:13px;}
  .s-badge{background:#00dfb0;color:#000;font-size:8px;font-weight:600;padding:2px 7px;border-radius:5px;}
  .tog{width:30px;height:18px;border-radius:9px;position:relative;flex-shrink:0;cursor:pointer;transition:background .2s;}
  .tog::after{content:'';position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:2px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.5);}
  .tog.on{background:#00dfb0;}
  .tog.on::after{left:14px;}
  .tog.off{background:#1e3530;}
  .tog.off::after{left:2px;}
  .range-row{display:flex;gap:5px;}
  .ropt{border:1px solid #1e3530;border-radius:7px;padding:3px 9px;font-size:8px;color:#1e3530;font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all .15s;}
  .ropt.on{border-color:#00dfb0;color:#00dfb0;}
  .slider-wrap{display:flex;flex-direction:column;gap:7px;padding:11px 14px;border-bottom:1px solid #080c09;}
  .slider-lbl{display:flex;justify-content:space-between;font-size:8px;}
  .slider-lbl span:first-child{color:#3a6858;}
  .slider-lbl span:last-child{color:#00dfb0;}
  .slider{height:4px;background:#111916;border-radius:2px;position:relative;}
  .slider-fill{height:100%;background:#00dfb0;border-radius:2px;}
  .slider-thumb{position:absolute;width:13px;height:13px;background:#00dfb0;border-radius:50%;top:50%;transform:translateY(-50%);box-shadow:0 0 0 2px #0d1712;}
  /* Paywall */
  .pw-hero{text-align:center;padding:16px 24px 12px;flex-shrink:0;}
  .pw-h{font-size:15px;color:#c0dcd6;font-weight:500;line-height:1.4;}
  .pw-sub{font-size:8.5px;color:#1a3028;margin-top:5px;}
  .feat-tbl{margin:0 14px;background:#0d1712;border-radius:13px;overflow:hidden;flex-shrink:0;}
  .feat-hdr{display:flex;align-items:center;padding:8px 14px 5px;border-bottom:1px solid #080c09;}
  .fhn{flex:1;font-size:7.5px;letter-spacing:.1em;color:#1a3028;text-transform:uppercase;}
  .fhf{width:54px;text-align:center;font-size:7.5px;color:#1a3028;text-transform:uppercase;letter-spacing:.1em;}
  .fhp{width:60px;text-align:right;font-size:7.5px;color:#00dfb0;text-transform:uppercase;letter-spacing:.1em;}
  .feat-row{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid #080c09;}
  .feat-row:last-child{border-bottom:none;}
  .fn{flex:1;font-size:9px;color:#3a6858;}
  .ff{width:54px;text-align:center;font-size:9px;color:#1a3028;}
  .fp{width:60px;text-align:right;font-size:9px;color:#00dfb0;}
  .cta-wrap{padding:14px 14px 6px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
  .cta-p{background:#00dfb0;border-radius:14px;padding:15px;text-align:center;font-size:10px;font-weight:600;color:#000;font-family:'IBM Plex Mono',monospace;cursor:pointer;position:relative;transition:opacity .15s;}
  .cta-p:active{opacity:.8;}
  .best{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#e0822a;color:#fff;font-size:7.5px;font-weight:600;padding:2px 10px;border-radius:8px;white-space:nowrap;}
  .cta-s{background:transparent;border:1px solid #1e3530;border-radius:14px;padding:14px;text-align:center;font-size:10px;color:#3a6858;font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:border-color .15s;}
  .cta-s:active{border-color:#00dfb0;}
  .restore{text-align:center;font-size:8px;color:#1a3028;padding:6px;flex-shrink:0;}
  .rdmap{margin:4px 14px 10px;background:#0a1009;border:1px dashed #1a2e25;border-radius:11px;padding:11px 14px;flex-shrink:0;}
  .rdmap-t{font-size:7.5px;letter-spacing:.12em;color:#1a3028;text-transform:uppercase;margin-bottom:8px;}
  .rdmap-i{display:flex;align-items:center;gap:7px;font-size:8.5px;color:#1e3530;padding:3px 0;}
  .rdi-dot{width:4px;height:4px;border-radius:50%;background:#2a4a3e;flex-shrink:0;}
  /* Tab bar */
  .tabbar{display:flex;border-top:1px solid #0f1712;padding:10px 0 16px;flex-shrink:0;background:#050807;}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:opacity .15s;}
  .tab:active{opacity:.6;}
  .tab-lbl{font-size:7px;letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div id="stage">
  <div class="label">BPM Radar · Interactive Prototype</div>
  <div id="root"></div>
  <div class="hint">Tap «Лучший кандидат» → Signal Analyzer &nbsp;·&nbsp; PRO → Paywall &nbsp;·&nbsp; Tab bar для навигации</div>
</div>

<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;

/* ────────────────────────────────────────────
   WAVEFORM (canvas, animated bars)
──────────────────────────────────────────── */
function seededRand(seed) {
  let s = (seed | 0) || 1;
  return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function Waveform({ mode='active', seed=1, height=120 }) {
  const ref = useRef(null);
  const raf = useRef(null);
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    // wait one tick for layout
    const init = () => {
      const parent = canvas.parentElement;
      if (!parent) return;
      const w = parent.offsetWidth || 375;
      const h = height;
      canvas.width  = w * 2;
      canvas.height = h * 2;
      canvas.style.width  = w + 'px';
      canvas.style.height = h + 'px';
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);
      const cfgs = {
        idle:   { amp: h * 0.06, speed: 0.5 },
        low:    { amp: h * 0.12, speed: 0.8 },
        active: { amp: h * 0.43, speed: 2.4, color: '#00dfb0' },
        amber:  { amp: h * 0.40, speed: 2.2, color: '#c8a020' },
      };
      const c = cfgs[mode] || cfgs.active;
      const color = c.color || '#00dfb0';
      const rng = seededRand(seed);
      const COUNT = 52;
      const base = Array.from({length:COUNT}, (_,i) =>
        Math.abs(Math.sin(i*0.19+0.4))*0.5 +
        Math.abs(Math.sin(i*0.08+1.1))*0.3 +
        Math.abs(Math.sin(i*0.41+0.9))*0.15 +
        rng()*0.05
      );
      let t = 0;
      const gap = 2, barW = Math.max(2, (w - (COUNT+1)*gap) / COUNT);
      const step = barW + gap;
      function frame() {
        ctx.clearRect(0,0,w,h);
        const mid = h/2;
        ctx.strokeStyle = 'rgba(0,223,176,0.05)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();
        base.forEach((v, i) => {
          const flicker = Math.sin(t*c.speed + i*0.6)*0.12 + Math.sin(t*c.speed*1.8+i*1.2)*0.07;
          const amp = Math.max(0.01, Math.min(1, v+flicker)) * c.amp;
          const x = gap + i*step, bh = Math.max(2, amp);
          const gr = ctx.createLinearGradient(x, mid-bh, x, mid+bh);
          gr.addColorStop(0,   color + 'ff');
          gr.addColorStop(0.5, color + 'aa');
          gr.addColorStop(1,   color + '33');
          ctx.fillStyle = gr;
          ctx.beginPath(); ctx.roundRect(x, mid-bh, barW, bh*2, 1); ctx.fill();
        });
        t += 0.035;
        raf.current = requestAnimationFrame(frame);
      }
      frame();
    };
    const tid = setTimeout(init, 30);
    return () => { clearTimeout(tid); cancelAnimationFrame(raf.current); };
  }, [mode, seed, height]);
  return <canvas ref={ref} style={{display:'block',background:'#040705'}} />;
}

function Spectrum({ active=true, seed=1, height=70 }) {
  const ref = useRef(null);
  const BASE = [78,72,68,60,54,48,44,38,32,26,22,17,13,10,8,6,5,4,3,3];
  const rng = seededRand(seed);
  const init = BASE.map(v => Math.max(3, v + (rng()-0.5)*8));
  useEffect(() => {
    if (!active) return;
    const el = ref.current; if (!el) return;
    const t = setInterval(() => {
      el.querySelectorAll('.sbar').forEach((b,i) => {
        b.style.height = Math.max(3, (BASE[i]||5) + (Math.random()-.5)*24) + '%';
      });
    }, 140);
    return () => clearInterval(t);
  }, [active]);
  return (
    <div ref={ref} style={{display:'flex',alignItems:'flex-end',height,padding:'0 22px',gap:2,background:'#040705',flexShrink:0}}>
      {init.map((h,i) => <div key={i} className="sbar" style={{flex:1,height:h+'%',background:'#00dfb0',borderRadius:'1px 1px 0 0',opacity:.65,transition:'height .14s'}} />)}
    </div>
  );
}

function MiniWave({ seed=1, color='#00dfb0' }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const W=48, H=24, ctx = c.getContext('2d');
    const rng = seededRand(seed);
    const N=18, gap=1, bw=Math.max(1,(W-(N+1)*gap)/N), step=bw+gap, mid=H/2;
    Array.from({length:N}).forEach((_,i) => {
      const v=(Math.abs(Math.sin(i*.33+.5))*.55+Math.abs(Math.sin(i*.14+1.2))*.3+rng()*.15);
      const amp=Math.max(1,Math.min(1,v)*(H*.44));
      const x=gap+i*step;
      const gr=ctx.createLinearGradient(x,mid-amp,x,mid+amp);
      gr.addColorStop(0,color+'cc'); gr.addColorStop(.5,color+'88'); gr.addColorStop(1,color+'cc');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.roundRect(x,mid-amp,bw,amp*2,1); ctx.fill();
    });
  }, [seed, color]);
  return <canvas ref={ref} width={48} height={24} style={{display:'block',flexShrink:0}} />;
}

/* FFT for Signal Analyzer */
function FFT({ height=150 }) {
  const ref = useRef(null);
  const raf = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const init = () => {
      const w = (c.parentElement?.offsetWidth || 375);
      c.width = w*2; c.height = height*2;
      c.style.width = w+'px'; c.style.height = height+'px';
      const ctx = c.getContext('2d'); ctx.scale(2,2);
      let t = 0;
      function frame() {
        ctx.clearRect(0,0,w,height);
        const pts = Array.from({length:w}, (_,x) => {
          const n = x/w;
          const y = Math.pow(1-n,1.7)*0.88
            + Math.exp(-Math.pow((n-.06)*12,2))*.3
            + Math.exp(-Math.pow((n-.22)*18,2))*.14
            + Math.sin(t*1.2+n*20)*.04*(1-n)
            + Math.sin(t*2.5+n*40)*.025*Math.pow(1-n,2);
          return {x, y: height - Math.max(0,Math.min(1,y))*(height*.88)};
        });
        const gr = ctx.createLinearGradient(0,0,0,height);
        gr.addColorStop(0,'rgba(0,223,176,.5)'); gr.addColorStop(.6,'rgba(0,223,176,.12)'); gr.addColorStop(1,'rgba(0,223,176,0)');
        ctx.beginPath(); ctx.moveTo(0,height);
        pts.forEach(p => ctx.lineTo(p.x,p.y));
        ctx.lineTo(w,height); ctx.closePath(); ctx.fillStyle=gr; ctx.fill();
        ctx.beginPath(); ctx.strokeStyle='rgba(0,223,176,.9)'; ctx.lineWidth=1.5;
        pts.forEach((p,i) => i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)); ctx.stroke();
        [.03,.14,.40,.65,.96].forEach(n => {
          ctx.strokeStyle='rgba(0,223,176,.08)'; ctx.lineWidth=.5;
          ctx.beginPath(); ctx.moveTo(n*w,0); ctx.lineTo(n*w,height); ctx.stroke();
        });
        t+=.025; raf.current=requestAnimationFrame(frame);
      }
      frame();
    };
    const tid = setTimeout(init, 30);
    return () => { clearTimeout(tid); cancelAnimationFrame(raf.current); };
  }, []);
  return <canvas ref={ref} style={{display:'block',width:'100%',background:'#040705'}} />;
}

/* ────────────────────────────────────────────

──────────────────────────────────────────── */
function Navigator() {
  const [tab, setTab] = useState('radar');
  const [stack, setStack] = useState([]);
  const push = useCallback(s => setStack(p => [...p, s]), []);
  const pop  = useCallback(() => setStack(p => p.slice(0,-1)), []);
  const topScreen = stack[stack.length-1] || null;

  const tabMap = { radar:<RadarScreen onPush={push}/>, history:<HistoryScreen/>, settings:<SettingsScreen onPush={push}/> };
  const pushMap = { analyzer:<AnalyzerScreen/>, paywall:<PaywallScreen/>, history:<HistoryScreen/>, settings:<SettingsScreen onPush={push}/> };

  const switchTab = (t) => { setStack([]); setTab(t); };

  return (
    <div className="phone">
      <div className="screens">
        {/* Tab screens */}
        {Object.entries(tabMap).map(([id, el]) => (
          <div key={id} className={`screen ${tab===id && !topScreen ? 'active' : 'hidden-left'}`}>
            {el}
            <TabBar active={tab} onChange={switchTab} />
          </div>
        ))}
        {/* Pushed screens */}
        {Object.entries(pushMap).map(([id, el]) => (
          <div key={id} className={`screen ${topScreen===id ? 'active' : 'hidden-right'}`}>
            <div style={{display:'flex',alignItems:'center',padding:'14px 20px 8px',borderBottom:'1px solid #0f1712',flexShrink:0,background:'#050807'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}} onClick={pop}>
                <IcoBack/>
                <span style={{fontSize:10,color:'#3a6858',letterSpacing:'.06em'}}>Назад</span>
              </div>
            </div>
            <div style={{flex:1,overflowY:'auto',overflowX:'hidden',display:'flex',flexDirection:'column'}}>
              {el}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
